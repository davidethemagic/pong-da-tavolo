<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>Pong da tavolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --floor: #0d1422;
    --table: #1d3f73;
    --table-edge: #152e56;
    --line: #eef3fb;
    --ball: #ff7a1a;
    --cpu: #e8394a;
    --you: #f4f6fa;
    --muted: #9fb2cf;
  }
  html, body { height: 100%; }
  body {
    background: var(--floor);
    color: var(--line);
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding-inline: 16px; box-sizing: border-box;
    user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; width: min(100%, 900px); gap: 12px; flex-wrap: wrap; }
  h1 { font-family: "Bungee", Impact, sans-serif; font-weight: 400; font-size: clamp(22px, 4vw, 34px); margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--ball); }
  .rule { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .wrap { position: relative; width: min(100%, 900px); aspect-ratio: 16 / 10; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: 0 0 0 6px var(--table-edge), 0 24px 60px rgba(0,0,0,.55); touch-action: none; cursor: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(13,20,34,.62); border-radius: 6px; text-align: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { font-family: "Bungee", Impact, sans-serif; font-weight: 400; font-size: clamp(26px, 6vw, 56px); margin: 0; text-wrap: balance; }
  .overlay p { margin: 0; color: var(--muted); max-width: 46ch; line-height: 1.5; font-size: 14px; }
  .levels { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font: 600 14px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
    background: transparent; color: var(--line); border: 2px solid var(--line); border-radius: 999px; padding: 10px 18px; cursor: pointer;
  }
  button:hover, button:focus-visible { background: var(--line); color: var(--floor); outline: none; }
  button.go { background: var(--ball); border-color: var(--ball); color: #1a0d02; }
  button.go:hover, button.go:focus-visible { background: #ffa25c; border-color: #ffa25c; }
  button[aria-pressed="true"] { background: var(--line); color: var(--floor); }
  footer { color: var(--muted); font-size: 12px; width: min(100%, 900px); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  kbd { border: 1px solid var(--muted); border-radius: 4px; padding: 0 5px; font-family: inherit; }
</style>

<header>
  <h1>Pong <span>da tavolo</span></h1>
  <div class="rule">Primo a 7 · scarto di 2</div>
</header>

<div class="wrap">
  <canvas id="c" width="1280" height="800" aria-label="Campo di gioco"></canvas>
  <div class="overlay" id="menu">
    <h2 id="menuTitle">Pong da tavolo</h2>
    <p id="menuText">Tu a sinistra, il computer a destra. Muovi la racchetta col mouse, col dito o coi tasti W/S e frecce.</p>
    <div class="levels" role="group" aria-label="Difficoltà">
      <button id="lv0" data-lv="0">Facile</button>
      <button id="lv1" data-lv="1" aria-pressed="true">Normale</button>
      <button id="lv2" data-lv="2">Difficile</button>
    </div>
    <button class="go" id="start">Gioca</button>
  </div>
</div>

<footer>
  <span><kbd>W</kbd> <kbd>S</kbd> / <kbd>↑</kbd> <kbd>↓</kbd> muovi · <kbd>Spazio</kbd> pausa · <kbd>M</kbd> audio</span>
  <span id="audioState">Audio attivo</span>
</footer>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const menu = document.getElementById('menu');
  const menuTitle = document.getElementById('menuTitle');
  const menuText = document.getElementById('menuText');
  const startBtn = document.getElementById('start');
  const audioState = document.getElementById('audioState');

  const PW = 18, PH = 130, R = 11, WIN = 7;
  const LEVELS = [
    { cpuSpeed: 520, react: 0.55, err: 70, serve: 560 },
    { cpuSpeed: 760, react: 0.75, err: 38, serve: 640 },
    { cpuSpeed: 1050, react: 0.92, err: 14, serve: 720 },
  ];
  let level = 1;
  try { const s = localStorage.getItem('pong-level'); if (s !== null) level = +s; } catch (e) {}
  setLevelButtons();

  const you = { x: 44, y: H/2 - PH/2, score: 0 };
  const cpu = { x: W - 44 - PW, y: H/2 - PH/2, score: 0, target: H/2 };
  const ball = { x: W/2, y: H/2, vx: 0, vy: 0, speed: 0 };
  let state = 'menu'; // menu | serve | play | pause | over
  let serveTimer = 0, serveDir = 1;
  let keys = {}, pointerY = null;
  let trail = [];
  let flash = 0, rally = 0;

  // ---- audio ----
  let ac = null, muted = false;
  function beep(freq, dur, type = 'square', vol = 0.08) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  // ---- input ----
  addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key === ' ') {
      if (state === 'play' || state === 'serve') { state = 'pause'; showMenu('Pausa', 'Premi Spazio o Riprendi per continuare.', 'Riprendi'); }
      else if (state === 'pause') resume();
      else if (state === 'menu' || state === 'over') newGame();
    }
    if (e.key.toLowerCase() === 'm') { muted = !muted; audioState.textContent = muted ? 'Audio spento' : 'Audio attivo'; }
    pointerY = null;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  function toCanvasY(clientY) {
    const r = cv.getBoundingClientRect();
    return (clientY - r.top) / r.height * H;
  }
  cv.addEventListener('pointermove', e => { pointerY = toCanvasY(e.clientY); });
  cv.addEventListener('pointerdown', e => { pointerY = toCanvasY(e.clientY); cv.setPointerCapture(e.pointerId); });

  document.querySelectorAll('[data-lv]').forEach(b => b.addEventListener('click', () => {
    level = +b.dataset.lv; setLevelButtons();
    try { localStorage.setItem('pong-level', level); } catch (e) {}
  }));
  function setLevelButtons() {
    document.querySelectorAll('[data-lv]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.lv === level)));
  }
  startBtn.addEventListener('click', () => { state === 'pause' ? resume() : newGame(); });

  function showMenu(title, text, btn) {
    menuTitle.textContent = title; menuText.textContent = text; startBtn.textContent = btn;
    menu.hidden = false;
  }
  function resume() { menu.hidden = true; state = ball.speed ? 'play' : 'serve'; }
  function newGame() {
    you.score = cpu.score = 0; serveDir = Math.random() < .5 ? -1 : 1;
    menu.hidden = true; startServe();
    beep(440, .08); setTimeout(() => beep(660, .1), 90);
  }
  function startServe() {
    ball.x = W/2; ball.y = H/2; ball.vx = ball.vy = 0; ball.speed = 0;
    trail = []; rally = 0; state = 'serve'; serveTimer = 0.9;
  }
  function launch() {
    const L = LEVELS[level];
    const a = (Math.random() * 0.8 - 0.4);
    ball.speed = L.serve;
    ball.vx = Math.cos(a) * ball.speed * serveDir;
    ball.vy = Math.sin(a) * ball.speed;
    state = 'play';
  }

  // ---- update ----
  function clampPaddle(p) { p.y = Math.max(8, Math.min(H - PH - 8, p.y)); }

  function update(dt) {
    // player
    const kSpeed = 900;
    if (keys['w'] || keys['arrowup']) you.y -= kSpeed * dt;
    if (keys['s'] || keys['arrowdown']) you.y += kSpeed * dt;
    if (pointerY !== null) you.y += (pointerY - PH/2 - you.y) * Math.min(1, dt * 22);
    clampPaddle(you);

    // cpu: predicts where the ball will cross its line, with error
    const L = LEVELS[level];
    if (ball.vx > 0 && state === 'play') {
      if (Math.random() < L.react * dt * 6) {
        let t = (cpu.x - ball.x) / ball.vx, y = ball.y + ball.vy * t;
        const span = H - 2*R;
        y = y - R; y = ((y % (2*span)) + 2*span) % (2*span); if (y > span) y = 2*span - y; y += R;
        cpu.target = y + (Math.random() * 2 - 1) * L.err;
      }
    } else if (ball.vx <= 0) {
      cpu.target += (H/2 - cpu.target) * dt * 1.5;
    }
    const d = cpu.target - (cpu.y + PH/2);
    cpu.y += Math.sign(d) * Math.min(Math.abs(d), L.cpuSpeed * dt);
    clampPaddle(cpu);

    if (flash > 0) flash -= dt;

    if (state === 'serve') { serveTimer -= dt; if (serveTimer <= 0) launch(); return; }
    if (state !== 'play') return;

    // ball, in substeps so fast balls don't tunnel through paddles
    const steps = Math.ceil(ball.speed * dt / 8);
    for (let i = 0; i < steps; i++) {
      const h = dt / steps;
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy); beep(220, .04, 'triangle'); }
      if (ball.y > H - R) { ball.y = H - R; ball.vy = -Math.abs(ball.vy); beep(220, .04, 'triangle'); }
      if (ball.vx < 0) hit(you, 1);
      else hit(cpu, -1);
      if (ball.x < -R * 2) return point(cpu, 1);
      if (ball.x > W + R * 2) return point(you, -1);
    }
    trail.push({ x: ball.x, y: ball.y }); if (trail.length > 14) trail.shift();
  }

  function hit(p, dir) {
    const faceX = dir === 1 ? p.x + PW : p.x;
    const inX = dir === 1 ? (ball.x - R <= faceX && ball.x > p.x) : (ball.x + R >= faceX && ball.x < p.x + PW);
    if (!inX || ball.y + R < p.y || ball.y - R > p.y + PH) return;
    const rel = ((ball.y - (p.y + PH/2)) / (PH/2));
    const ang = Math.max(-1, Math.min(1, rel)) * (Math.PI / 3.2);
    rally++;
    ball.speed = Math.min(ball.speed * 1.045, 1700);
    ball.vx = Math.cos(ang) * ball.speed * dir;
    ball.vy = Math.sin(ang) * ball.speed;
    ball.x = dir === 1 ? faceX + R : faceX - R;
    beep(dir === 1 ? 520 : 390, .06);
  }

  function point(winner, nextDir) {
    winner.score++; flash = .35;
    serveDir = nextDir;
    beep(winner === you ? 880 : 160, .25, winner === you ? 'square' : 'sawtooth', .07);
    const a = you.score, b = cpu.score;
    if ((a >= WIN || b >= WIN) && Math.abs(a - b) >= 2) {
      state = 'over';
      const won = a > b;
      showMenu(won ? 'Hai vinto' : 'Vince il computer', `${a} – ${b}. Cambia livello o rigioca.`, 'Rigioca');
      return;
    }
    startServe();
  }

  // ---- draw ----
  function draw() {
    // table
    ctx.fillStyle = flash > 0 ? '#23498a' : '#1d3f73';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#eef3fb'; ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.lineWidth = 3; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
    ctx.globalAlpha = 1;
    // net
    ctx.fillStyle = 'rgba(238,243,251,.85)';
    for (let y = 10; y < H; y += 26) ctx.fillRect(W/2 - 3, y, 6, 14);

    // scores
    ctx.font = '120px Bungee, Impact, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(238,243,251,.22)';
    ctx.fillText(you.score, W/2 - 150, 40);
    ctx.fillText(cpu.score, W/2 + 150, 40);
    ctx.font = '600 22px "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(238,243,251,.45)';
    ctx.fillText('TU', W/2 - 150, 175);
    ctx.fillText('CPU', W/2 + 150, 175);
    if (rally >= 6 && state === 'play') {
      ctx.fillStyle = 'rgba(255,122,26,.8)';
      ctx.fillText(`scambio ${rally}`, W/2, H - 50);
    }

    // paddles
    ctx.fillStyle = '#f4f6fa'; roundRect(you.x, you.y, PW, PH, 6);
    ctx.fillStyle = '#e8394a'; roundRect(cpu.x, cpu.y, PW, PH, 6);

    // ball + trail
    trail.forEach((t, i) => {
      ctx.globalAlpha = (i / trail.length) * .35;
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath(); ctx.arc(t.x, t.y, R * (i / trail.length), 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (state !== 'serve' || Math.floor(serveTimer * 6) % 2 === 0) {
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(ball.x - 3, ball.y - 3, 3.5, 0, Math.PI*2); ctx.fill();
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.fonts && document.fonts.ready.then(draw);
})();
</script>

</html>
